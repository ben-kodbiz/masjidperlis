name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync canonical data into public site
        run: |
          mkdir -p public/data
          cp data/*.json public/data/

      - name: Set up Pages
        uses: actions/configure-pages@v4
        id: configure

      - name: Generate PWA icons
        run: |
          python3 tools/gen_icons.py

      - name: Build static SEO pages + service worker
        run: |
          python3 tools/build_site.py \
            --site-url "${{ steps.configure.outputs.base_url }}/" \
            --version "${{ github.sha }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4